name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** paste file lists, logs or configs that contain private data.
  - type: input
    id: version
    attributes:
      label: Eichhorn version
      description: Output of `eichhorn --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, other]
    validations:
      required: true
  - type: input
    id: filesystem
    attributes:
      label: File system of the backup drive
      description: e.g. APFS, NTFS, ext4, exFAT (see `eichhorn repo list`)
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran, its output, and what you expected instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `eichhorn config check`
      render: text
