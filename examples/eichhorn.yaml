# Global settings. Copy to your config folder (see docs/configuration.md).
defaults:
  checksums: true
  engine: auto
  keep_awake: true
  retention:
    keep_last: 6
    keep_monthly: 12

# Repositories are usually added by `eichhorn repo init`, which writes
